name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    name: Host checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned SDK
        run: python -m pip install -r requirements.txt
      - name: Publication guard
        # The native F3D fixture uses ZIP Zstandard, supported by Python 3.14.
        if: matrix.python == '3.14'
        run: python scripts/check_public.py
      - name: Python host tests (no Fusion or account)
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Palette and motion-player tests
        run: |
          node tests/test_palette.cjs
          node tests/test_motion_player.cjs
      - name: Offline command help
        run: |
          python agent/fusion_cli.py help
          python agent/fusion_cli.py design motion inspect --help
      - name: Documentation links and search metadata
        run: python scripts/check_site.py
