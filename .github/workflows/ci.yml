name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    name: Host checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned SDK
        run: python -m pip install -r requirements.txt
      - name: Publication guard
        # The native F3D fixture uses ZIP Zstandard, supported by Python 3.14.
        if: matrix.python == '3.14'
        run: python scripts/check_public.py
      - name: Python host tests (no Fusion or account)
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Palette and motion-player tests
        run: |
          node tests/test_palette.cjs
          node tests/test_motion_player.cjs
      - name: Offline command help
        run: |
          python agent/fusion_cli.py help
          python agent/fusion_cli.py design motion inspect --help
