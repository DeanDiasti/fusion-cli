<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CadBot</title>
<style>
:root{color-scheme:dark;--bg:#171a20;--panel:#222630;--line:#343a47;--muted:#9da7b8;--accent:#91b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf0f5;font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh}button,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:inherit;padding:6px 10px}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:650;letter-spacing:.03em}.dot{color:#91d4b0;margin-right:6px}#status{font-size:11px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:6px}.actions button{font-size:11px;padding:5px 7px}#conversation{flex:1;overflow:auto;padding:18px 16px;scroll-behavior:smooth}#welcome{padding:25px 2px}#welcome h1{font-size:24px;line-height:1.25;letter-spacing:-.6px;font-weight:550;margin:0 0 12px}#welcome p{color:var(--muted);margin:0 0 22px}.suggestion{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}.message{margin:0 0 20px;overflow-wrap:anywhere}.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}.body{white-space:pre-wrap}.user .body{background:#292f3c;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.error{color:#ffb5b5;background:#36252b;padding:10px;border-radius:8px}.reference{max-width:100%;max-height:180px;border-radius:8px;margin:6px 4px 0 0}details{margin:8px 0 14px;border:1px solid var(--line);border-radius:8px;background:#1d2129}summary{cursor:pointer;padding:9px 11px;font-size:12px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 ui-monospace,monospace;padding:0 11px 10px;max-height:280px;overflow:auto;color:#b9c4d5}.tool-state{color:var(--muted);font-size:10px;margin-left:8px}footer{padding:12px 14px;border-top:1px solid var(--line);background:var(--bg)}.composer{border:1px solid #465166;border-radius:12px;background:var(--panel);padding:10px}.composer:focus-within{border-color:var(--accent)}textarea{resize:none;width:100%;height:1.55em;min-height:1.55em;max-height:7.75em;line-height:1.55;overflow-y:hidden;display:block;border:0;outline:0;background:transparent;color:inherit;padding:0}textarea::placeholder{color:#8e98aa}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}#send{background:#b0caff;color:#182338;border:0;font-weight:600;padding:7px 15px}#send.is-stopping{font-size:19px;color:#000}.hint{color:var(--muted);font-size:10px;margin:7px 2px 0}#attachments{display:flex;gap:8px;flex-wrap:wrap}.attachment{position:relative;margin-bottom:9px}.attachment img{width:62px;height:62px;object-fit:cover;border-radius:6px}.attachment button{position:absolute;right:-3px;top:-4px;padding:0 5px}#login{color:var(--accent)}[hidden]{display:none!important}.dragging{outline:2px dashed var(--accent);outline-offset:-6px}
.model-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted)}#model{min-width:0;flex:1;font:inherit;color:#edf0f5;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px}#model:disabled{opacity:.5}
.composer{background:#292929;border-color:#3b3b3b;border-radius:24px;padding:16px}.composer-bottom{margin-top:10px}.model-controls{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-width:0;flex:1}#model,#effort{font:inherit;background:transparent;color:#ddd;border:0;max-width:45%;min-width:0;padding:5px 0}#model{flex:0 1 auto}#effort{color:#aaa;max-width:25%}option{background:#292929}#attach{font-size:26px;padding:0 4px;border:0;background:transparent}#send{border-radius:50%;width:36px;height:36px;padding:0;font-size:23px;background:#fff;flex-shrink:0}.attachment{border:1px solid #484848;border-radius:15px;overflow:visible;background:#222}.attachment img{display:block;width:110px;height:110px;object-fit:cover;border-radius:14px}.attachment button{border-radius:50%;right:4px;top:4px;background:#222c}.file-name{display:block;max-width:200px;padding:20px 26px 20px 12px;overflow-wrap:anywhere;color:#ddd}.reference{border:1px solid #484848;border-radius:14px}.hint{font-size:10px}
.history-row{padding:8px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}#history{min-width:0;flex:1;background:var(--panel);color:#edf0f5;border:1px solid var(--line);border-radius:6px;padding:6px}.checkpoint-menu{background:transparent;border:0;margin:6px 0;font-size:11px}.checkpoint-menu summary{padding:3px 0;color:var(--muted)}.checkpoint-menu button{display:block;width:100%;text-align:left;margin:4px 0;font-size:11px}</style></head><body>
<header><div><div class="brand"><span class="dot">●</span>CADBOT</div><div id="status" role="status">Connecting to Codex…</div></div><div class="actions"><button id="login" hidden>Sign in</button><button id="reconnect">Reconnect</button><button id="new">New chat</button></div></header>
<div class="history-row"><label for="history">Conversations</label><select id="history" aria-label="Saved conversations"><option value="">New conversation</option></select><span id="restore-status" role="status"></span></div>
<main id="conversation" aria-label="Conversation" aria-live="polite"><div id="welcome"><h1>What are we building?</h1><p>Describe a part or add a reference image. I’ll build it in your active Fusion design.</p><button class="suggestion">Create a 20 mm cube with 2 mm fillets</button><button class="suggestion">Inspect my current design</button></div></main>
<footer><div class="composer"><div id="attachments"></div><textarea rows="1" id="input" aria-label="Message CadBot" placeholder="Ask CadBot, or attach reference files…"></textarea><div class="composer-bottom"><button id="attach" title="Add files" aria-label="Add files">＋</button><div class="model-controls"><select id="model" aria-label="Model" disabled><option value="">Default model</option></select><select id="effort" aria-label="Reasoning effort" disabled></select><button id="send" aria-label="Send message" disabled>↑</button></div></div></div><div class="hint">Enter to send · Drop files or paste images · 4 files, 5 MB each</div><input id="files" type="file" multiple hidden></footer>
<script src="chat.js"></script></body></html>
